<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" rx="18" fill="#0b1220"/>
  <rect x="0" y="0" width="1200" height="54" rx="18" fill="#16243a"/>
  <circle cx="28" cy="27" r="7" fill="#ff5f56"/><circle cx="52" cy="27" r="7" fill="#ffbd2e"/><circle cx="76" cy="27" r="7" fill="#27c93f"/>
  <text x="110" y="34" fill="#b7c8df" font-family="Segoe UI, sans-serif" font-size="18">system_monitor.py</text>
  <g font-family="Consolas, monospace" font-size="19">
    <text x="34" y="92" fill="#607895">01</text><text x="72" y="92" fill="#dbeafe">class</text><text x="136" y="92" fill="#7dd3fc">SystemMonitor</text><text x="282" y="92" fill="#dbeafe">:</text>
    <text x="34" y="128" fill="#607895">02</text><text x="72" y="128" fill="#dbeafe">    </text><text x="126" y="128" fill="#94a3b8">"""Collect live resource utilization."""</text>
    <text x="34" y="164" fill="#607895">03</text><text x="72" y="164" fill="#dbeafe">    </text><text x="126" y="164" fill="#dbeafe">def</text><text x="174" y="164" fill="#f0abfc">capture_reading</text><text x="340" y="164" fill="#dbeafe">(self) -&gt; SystemReading:</text>
    <text x="34" y="200" fill="#607895">04</text><text x="72" y="200" fill="#dbeafe">        </text><text x="178" y="200" fill="#94a3b8"># CPU and per-core utilization</text>
    <text x="34" y="236" fill="#607895">05</text><text x="72" y="236" fill="#dbeafe">        </text><text x="178" y="236" fill="#7dd3fc">cpu_pct</text><text x="270" y="236" fill="#dbeafe"> = psutil.cpu_percent(interval=None)</text>
    <text x="34" y="272" fill="#607895">06</text><text x="72" y="272" fill="#dbeafe">        </text><text x="178" y="272" fill="#7dd3fc">cpu_cores</text><text x="290" y="272" fill="#dbeafe"> = psutil.cpu_percent(percpu=True)</text>
    <text x="34" y="308" fill="#607895">07</text><text x="72" y="308" fill="#dbeafe">        </text><text x="178" y="308" fill="#7dd3fc">memory</text><text x="270" y="308" fill="#dbeafe"> = psutil.virtual_memory()</text>
    <text x="34" y="344" fill="#607895">08</text><text x="72" y="344" fill="#dbeafe">        </text><text x="178" y="344" fill="#7dd3fc">disk</text><text x="242" y="344" fill="#dbeafe"> = psutil.disk_usage(self.target_disk_path)</text>
    <text x="34" y="380" fill="#607895">09</text><text x="72" y="380" fill="#dbeafe">        </text><text x="178" y="380" fill="#94a3b8"># Unsupported sensors remain explicitly unavailable</text>
    <text x="34" y="416" fill="#607895">10</text><text x="72" y="416" fill="#dbeafe">        </text><text x="178" y="416" fill="#dbeafe">return</text><text x="246" y="416" fill="#7dd3fc">SystemReading</text><text x="390" y="416" fill="#dbeafe">(cpu_percent=cpu_pct, ...)</text>
    <text x="34" y="490" fill="#64748b">Telemetry is collected locally through psutil and passed to the analysis layer.</text>
    <text x="34" y="540" fill="#38bdf8">Smart Computer Health Monitor</text><text x="328" y="540" fill="#94a3b8"> • offline monitoring</text>
  </g>
</svg>
