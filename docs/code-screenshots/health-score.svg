<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" rx="18" fill="#0b1220"/>
  <rect x="0" y="0" width="1200" height="54" rx="18" fill="#16243a"/>
  <circle cx="28" cy="27" r="7" fill="#ff5f56"/><circle cx="52" cy="27" r="7" fill="#ffbd2e"/><circle cx="76" cy="27" r="7" fill="#27c93f"/>
  <text x="110" y="34" fill="#b7c8df" font-family="Segoe UI, sans-serif" font-size="18">health_score.py</text>
  <g font-family="Consolas, monospace" font-size="19">
    <text x="34" y="92" fill="#607895">01</text><text x="72" y="92" fill="#dbeafe">class</text><text x="136" y="92" fill="#7dd3fc">HealthScoreCalculator</text><text x="356" y="92" fill="#dbeafe">:</text>
    <text x="34" y="128" fill="#607895">02</text><text x="72" y="128" fill="#dbeafe">    </text><text x="126" y="128" fill="#dbeafe">def</text><text x="174" y="128" fill="#f0abfc">calculate</text><text x="270" y="128" fill="#dbeafe">(reading, settings):</text>
    <text x="34" y="164" fill="#607895">03</text><text x="72" y="164" fill="#dbeafe">        </text><text x="178" y="164" fill="#7dd3fc">breakdown</text><text x="292" y="164" fill="#dbeafe"> = {</text><text x="340" y="164" fill="#a7f3d0">"cpu_deduction"</text><text x="525" y="164" fill="#dbeafe">: 0.0, ...}</text>
    <text x="34" y="200" fill="#607895">04</text><text x="72" y="200" fill="#dbeafe">        </text><text x="178" y="200" fill="#dbeafe">if</text><text x="212" y="200" fill="#7dd3fc"> reading.cpu_percent</text><text x="424" y="200" fill="#dbeafe"> &gt;= settings.cpu_critical_pct:</text>
    <text x="34" y="236" fill="#607895">05</text><text x="72" y="236" fill="#dbeafe">            </text><text x="244" y="236" fill="#7dd3fc">breakdown</text><text x="358" y="236" fill="#dbeafe">[</text><text x="370" y="236" fill="#a7f3d0">"cpu_deduction"</text><text x="550" y="236" fill="#dbeafe">] = 18.0 + scaled_excess</text>
    <text x="34" y="272" fill="#607895">06</text><text x="72" y="272" fill="#dbeafe">        </text><text x="178" y="272" fill="#dbeafe">if</text><text x="212" y="272" fill="#7dd3fc"> both_cpu_and_ram_are_heavy:</text>
    <text x="34" y="308" fill="#607895">07</text><text x="72" y="308" fill="#dbeafe">            </text><text x="244" y="308" fill="#dbeafe">total_deduction *= </text><text x="450" y="308" fill="#fbbf24">0.85</text>
    <text x="34" y="344" fill="#607895">08</text><text x="72" y="344" fill="#dbeafe">        </text><text x="178" y="344" fill="#7dd3fc">score</text><text x="240" y="344" fill="#dbeafe"> = max(0.0, min(100.0, 100.0 - total_deduction))</text>
    <text x="34" y="380" fill="#607895">09</text><text x="72" y="380" fill="#dbeafe">        </text><text x="178" y="380" fill="#dbeafe">return</text><text x="246" y="380" fill="#7dd3fc"> HealthScoreResult</text><text x="414" y="380" fill="#dbeafe">(score=score, ...)</text>
    <text x="34" y="490" fill="#64748b">Deterministic deductions make the result explainable and testable.</text>
    <text x="34" y="540" fill="#38bdf8">Health score: 0–100</text><text x="220" y="540" fill="#94a3b8"> • CPU • RAM • disk • battery</text>
  </g>
</svg>
